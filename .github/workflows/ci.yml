name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: "./OmamagotoApp/OmamagotoApp.csproj"

jobs:
  ios:
    name: iOS build
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install iOS workload
        run: dotnet workload install maui-ios

      - name: Restore
        run: >
          dotnet restore "${{ env.PROJECT_PATH }}"
          -p:TargetFramework=net10.0-ios
          -p:RuntimeIdentifier=iossimulator-x64

      - name: Build iOS simulator
        run: >
          dotnet build "${{ env.PROJECT_PATH }}"
          --configuration Release
          --framework net10.0-ios
          --runtime iossimulator-x64
          --no-restore